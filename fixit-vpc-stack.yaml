AWSTemplateFormatVersion: "2010-09-09"
Description: Geetha's VPC lab as code - VPC, public subnet, internet gateway, route, security group and an NGINX web server.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 image (looked up automatically)

Resources:
  # The private neighborhood
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: cfn-fixit-vpc

  # One street in the neighborhood
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: cfn-public-subnet-1

  # The main gate
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: cfn-fixit-igw

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # The road signs
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: cfn-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # The firewall: HTTP only, no SSH
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cfn-web-sg

  # The web server, wearing the ec2-ssm-role badge
  WebServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - SubnetRouteAssociation
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: ec2-ssm-role
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y nginx
          systemctl enable --now nginx
          echo "<h1>Geetha's CloudFormation Lab</h1>" > /usr/share/nginx/html/index.html
      Tags:
        - Key: Name
          Value: cfn-web-server

Outputs:
  WebsiteUrl:
    Description: Open this address in your browser (it must start with http)
    Value: !Sub "http://${WebServer.PublicIp}"